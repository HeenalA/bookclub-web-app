<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratings — To Read or Not to Read</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

  <nav class="topnav">
    <span class="logo">To Read or Not to Read</span>
    <div class="profile-area">
      <button class="profile-tab" id="profile-tab" title="Click to switch user — demo only, not real login yet">Profile</button>
      <span class="welcome-msg" id="welcome-msg">Welcome…</span>
    </div>
  </nav>

  <nav class="club-nav">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="ratings.html" class="active">Ratings</a>
      <a href="reviews.html">Reviews</a>
    </div>
  </nav>

  <div class="card" style="margin:0; border-radius:0; border-left:none; border-right:none; border-top:none;">
    <div class="page-header">
      <span class="page-title">Book ratings</span>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:#7B9EC9;"></span>Maya picked</div>
        <div class="legend-item"><span class="legend-dot" style="background:#C97B9E;"></span>Mina picked</div>
        <div class="legend-item"><span class="legend-dot" style="background:#9E7BC9;"></span>Heenal picked</div>
      </div>
    </div>
    <p class="page-note">Chip color = who picked the book · Drag chips to rerank · Each member edits their own column only</p>

    <div class="table-wrap">
      <table class="ratings-tbl">
        <colgroup>
          <col class="col-star"/>
          <col class="col-member"/>
          <col class="col-member"/>
          <col class="col-member"/>
        </colgroup>
        <thead>
          <tr>
            <th></th>
            <th class="col-member" id="col-head-maya">
              <div class="flex-center gap-6">
                <div class="avatar avatar-md" style="background:#7B9EC9;">M</div>Maya
              </div>
            </th>
            <th class="col-member" id="col-head-mina">
              <div class="flex-center gap-6">
                <div class="avatar avatar-md" style="background:#C97B9E;">Mi</div>Mina
              </div>
            </th>
            <th class="col-member" id="col-head-heenal">
              <div class="flex-center gap-6">
                <div class="avatar avatar-md" style="background:#9E7BC9;">H</div>Heenal
              </div>
            </th>
          </tr>
        </thead>
        <tbody id="ratings-body"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
