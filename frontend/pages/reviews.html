<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews — To Read or Not to Read</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>

  <nav class="topnav">
    <span class="logo">To Read or Not to Read</span>
    <div class="profile-area">
      <button class="profile-tab" id="profile-tab" title="Click to switch user — demo only, not real login yet">Profile</button>
      <span class="welcome-msg" id="welcome-msg">Welcome…</span>
    </div>
  </nav>

  <nav class="club-nav">
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="ratings.html">Ratings</a>
      <a href="reviews.html" class="active">Reviews</a>
    </div>
  </nav>

  <div style="background:var(--bg-card); border-bottom:1px solid var(--border);">
    <div class="page-header">
      <span class="page-title">Reviews</span>
      <input type="text" placeholder="Search books…" style="font-size:12px;padding:5px 13px;border:1px solid var(--border);border-radius:20px;background:var(--bg-secondary);color:var(--text-secondary);width:170px;outline:none;font-family:'DM Sans',sans-serif;">
    </div>
  </div>

  <div style="overflow-x:auto; background:var(--bg-card);">
    <table class="reviews-tbl">
      <thead>
        <tr>
          <th style="min-width:170px;">Book</th>
          <th style="min-width:210px;" id="col-head-maya">
            <div class="flex-center gap-6">
              <div class="avatar avatar-sm" style="background:#7B9EC9;">M</div>Maya
            </div>
          </th>
          <th style="min-width:210px;" id="col-head-mina">
            <div class="flex-center gap-6">
              <div class="avatar avatar-sm" style="background:#C97B9E;">Mi</div>Mina
            </div>
          </th>
          <th style="min-width:210px;" id="col-head-heenal">
            <div class="flex-center gap-6">
              <div class="avatar avatar-sm" style="background:#9E7BC9;">H</div>Heenal
            </div>
          </th>
        </tr>
      </thead>
      <tbody id="reviews-body"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
